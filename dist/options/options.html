<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="options.css" />
  <title>CANazon settings</title>
</head>
<body>
  <main>
    <div class="topbar">
      <header class="brand">
        <img src="../icons/icon32.png" width="32" height="32" alt="" />
        <strong><span>CAN</span>azon</strong>
      </header>
      <div class="purpose">Buy Canadian</div>
    </div>

    <section class="settings" aria-labelledby="settings-title">
      <h1 id="settings-title">How should CANazon help?</h1>

      <label class="mode selected">
        <input type="radio" name="mode" value="canadian-first" checked />
        <span class="radio" aria-hidden="true"></span>
        <span><strong>Sort Canadian first</strong><small>Sort Canadian products first. Frost American-owned products.</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="labels-only" />
        <span class="radio" aria-hidden="true"></span>
        <span><strong>Show labels only</strong><small>Highlight Canadian products. Frost American-owned products.</small></span>
      </label>
      <label class="mode">
        <input type="radio" name="mode" value="paused" />
        <span class="radio" aria-hidden="true"></span>
        <span><strong>Pause CANazon</strong><small>Leave Amazon unchanged.</small></span>
      </label>

      <footer>
        <span id="status" class="status" role="status">✓ Saved automatically</span>
        <div class="share" aria-label="Share CANazon">
          <span>Share CANazon</span>
          <button id="share-x" type="button" aria-label="Share CANazon on X" title="Share on X">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22H17l-4.9-6.4L6.5 22H3.4l7.2-8.2L.8 2h6.4l4.4 5.8L18.9 2Zm-1.1 17.8h1.7L6.3 4.1H4.5l13.3 15.7Z"/></svg>
          </button>
          <button id="share-facebook" type="button" aria-label="Share CANazon on Facebook" title="Share on Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.6-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.3l-.5 3.5h-2.8v8.4A12 12 0 0 0 24 12Z"/></svg>
          </button>
        </div>
      </footer>
    </section>
  </main>
  <script src="options.js"></script>
</body>
</html>
